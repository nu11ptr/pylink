name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Embed and relocate (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      PYLINK_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # This interpreter drives the tests and packaging script. The consumer
      # builds explicitly set PYO3_PYTHON to a nonexistent executable.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pylink-cache
          key: pylink-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-${{ hashFiles('build_support/distributions.tsv') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check PyO3 hello example formatting
        working-directory: examples/hello-pyo3
        run: cargo fmt -- --check
      - name: Check basic integration test fixture formatting
        working-directory: tests/fixtures/basic-app
        run: cargo fmt -- --check
      - name: Check PyO3 integration test fixture formatting
        working-directory: tests/fixtures/pyo3-app
        run: cargo fmt -- --check
      - name: Build without a C compiler, initialize, reuse cache offline, and relocate
        env:
          PYLINK_CACHE_DIR: ${{ runner.temp }}/pylink-cache
        run: python scripts/smoke.py

  package:
    name: Package and MSRV (Rust 1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pylink-cache
          key: pylink-${{ runner.os }}-${{ runner.arch }}-3.14-${{ hashFiles('build_support/distributions.tsv') }}
      - name: Test minimum supported Rust
        env:
          PYLINK_CACHE_DIR: ${{ runner.temp }}/pylink-cache
        run: |
          cargo test --locked --all-targets
          cargo test --locked --doc
      - name: Verify crate package
        env:
          PYLINK_CACHE_DIR: ${{ runner.temp }}/pylink-cache
        run: cargo package --locked
      - name: Build docs.rs documentation without downloading Python
        env:
          DOCS_RS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/pylink-docs-target
          PYLINK_CACHE_DIR: ${{ runner.temp }}/pylink-docs-cache
          PYLINK_OFFLINE: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --locked --no-deps
          test ! -e "$PYLINK_CACHE_DIR"
